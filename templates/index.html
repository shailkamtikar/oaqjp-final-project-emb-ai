<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="card-title">Emotion Detector</h1>
                <p class="text-muted">Enter a statement and the application will detect the emotions it expresses.</p>
                <div class="mb-3">
                    <label for="textToAnalyze" class="form-label">Statement</label>
                    <textarea id="textToAnalyze" class="form-control" rows="3"
                        placeholder="e.g. I love this new technology"></textarea>
                </div>
                <button class="btn btn-primary" onclick="RunSentimentAnalysis()">Run Emotion Detection</button>
                <div id="system_response" class="mt-4"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
